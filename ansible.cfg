# =============================================================================
# Shared Ansible settings for every playbook and role in this repository.
# Ascender picks this file up automatically from the project root. Settings
# here must stay safe for hardened hosts (CIS: /tmp noexec, strict sshd).
# =============================================================================

[defaults]
# Ascender passes its own inventory with -i; this default is for local runs.
inventory            = inventories/lab/hosts.yml
roles_path           = roles
# Account created by playbooks/bootstrap.yml (cis_automation_user). The machine
# credential in Ascender sets the same user explicitly. The lab inventory
# still uses svc_ansible: for local runs against it pass -u svc_ansible.
remote_user          = ansible
interpreter_python   = auto_silent
forks                = 20
timeout              = 30
callback_result_format = yaml

# Keep the default (~/.ansible/tmp). Under CIS L1 /home is nodev,nosuid but NOT
# noexec. Do NOT move remote_tmp to /tmp or /var/tmp: both are noexec under CIS.
# (Ansible runs modules as "python3 AnsiballZ_x.py", so noexec on the tmp dir
#  rarely matters for modules anyway - it matters for things executed directly:
#  the script module, git ssh wrappers, vendor installers, Terraform remote-exec.)
remote_tmp           = ~/.ansible/tmp

[privilege_escalation]
become               = true
become_method        = sudo

[ssh_connection]
# Pipelining: modules are fed through stdin, no temp file at all for most tasks.
# Works with sudo-rs (requiretty is not supported/needed there).
pipelining           = true
# ControlPersist reuses one TCP/SSH session per host (fewer MaxStartups hits).
# ServerAlive* answers the server's ClientAlive probes and detects dead links.
# No IdentitiesOnly here: Ascender/AWX hands the machine credential's key to
# ssh through ssh-agent, and IdentitiesOnly=yes makes ssh ignore agent keys
# that have no matching IdentityFile ("Permission denied (publickey)").
# Local runs with an ssh-agent full of keys (MaxAuthTries 4 -> "Too many
# authentication failures"): pass the key explicitly instead, e.g.
#   ansible-playbook ... --private-key ~/.ssh/ascender_svc_ansible -e 'ansible_ssh_extra_args="-o IdentitiesOnly=yes"'
ssh_args             = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=4
