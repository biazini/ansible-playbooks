---
# yamllint disable rule:commas
# ---------------------------------------------------------------------------
# Site-specific values. Everything else lives in the role defaults.
# ---------------------------------------------------------------------------

# Automation account (Ansible / Terraform / Packer all use this one)
cis_automation_user: svc_ansible
cis_automation_group: automation
cis_automation_pubkeys:
  - "ssh-ed25519 AAAA...replace-me... ansible-controller"

# Networks allowed to reach SSH. MUST include the Ansible controller, the
# Terraform runner / GitLab runner and the bastion. The preflight aborts if the
# address Ansible is connecting from is not inside one of these.
cis_mgmt_cidrs:
  - 10.20.0.0/24      # ansible controller + gitlab runners
  - 10.20.1.10/32     # bastion

# Egress allow-list (only used when cis_ufw_default_outgoing == "deny").
# Point 80/443 at your proxy / Landscape / mirror instead of "any" if you can.
cis_ufw_egress_rules:
  - { port: "53",   proto: udp, to: any,          comment: "DNS" }
  - { port: "53",   proto: tcp, to: any,          comment: "DNS (TCP fallback)" }
  - { port: "67",   proto: udp, to: any,          comment: "DHCP client" }
  - { port: "123",  proto: udp, to: any,          comment: "NTP" }
  - { port: "4460", proto: tcp, to: any,          comment: "NTS-KE (chrony default on 26.04)" }
  - { port: "80",   proto: tcp, to: any,          comment: "APT mirror" }
  - { port: "443",  proto: tcp, to: any,          comment: "APT / Ubuntu Pro / snap store" }
  # - { port: "3128", proto: tcp, to: 10.20.0.5,  comment: "HTTP proxy" }
  # - { port: "88",   proto: udp, to: 10.20.2.0/24, comment: "Kerberos (AD join)" }
  # - { port: "88",   proto: tcp, to: 10.20.2.0/24, comment: "Kerberos (AD join)" }
  # - { port: "389",  proto: tcp, to: 10.20.2.0/24, comment: "LDAP (AD join)" }
  # - { port: "514",  proto: tcp, to: 10.20.3.5,  comment: "Central syslog" }

# Internal time sources (empty = keep Ubuntu's NTS pools)
cis_ntp_servers: []
#  - ntp1.corp.example
#  - ntp2.corp.example
