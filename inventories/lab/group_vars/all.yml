---
# yamllint disable rule:commas
# ---------------------------------------------------------------------------
# Lab values (VirtualBox VM managed by Ascender). Role defaults hold the rest.
# ---------------------------------------------------------------------------

# Automation account used by Ascender ("Ubuntu VM - svc_ansible (SSH key)"
# machine credential). Created by playbooks/bootstrap.yml on first use.
cis_automation_user: svc_ansible
cis_automation_group: automation
cis_automation_pubkeys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID1KjlEgBfn/HXsPlGu+okVxOjrV6F9dgsCGhnmnEcfE ascender-svc_ansible"

# Networks allowed to reach SSH once ufw is enabled. With VirtualBox NAT +
# port forwarding every inbound SSH connection comes from the NAT gateway.
# If the VM moves to a host-only/bridged network, put the Ascender source here.
cis_mgmt_cidrs:
  - 10.0.2.2/32       # VirtualBox NAT gateway (Ascender via port forward)

# Egress allow-list (only used when cis_ufw_default_outgoing == "deny").
cis_ufw_egress_rules:
  - { port: "53",   proto: udp, to: any,          comment: "DNS" }
  - { port: "53",   proto: tcp, to: any,          comment: "DNS (TCP fallback)" }
  - { port: "67",   proto: udp, to: any,          comment: "DHCP client" }
  - { port: "123",  proto: udp, to: any,          comment: "NTP" }
  - { port: "4460", proto: tcp, to: any,          comment: "NTS-KE (chrony default on 26.04)" }
  - { port: "80",   proto: tcp, to: any,          comment: "APT mirror" }
  - { port: "443",  proto: tcp, to: any,          comment: "APT / Ubuntu Pro / snap store" }

# Keep Ubuntu's NTS pools
cis_ntp_servers: []
