---
# ---------------------------------------------------------------------------
# Variables for the "selfheal_ops" group (ops.yml): the workstation that runs
# Prometheus, Alertmanager and ansible-rulebook next to Ascender.
# Only site values live here; every tunable is documented in the role
# defaults (monitoring_stack, eda_rulebook, selfheal_controller).
# ---------------------------------------------------------------------------

# Ascender API as seen from the workstation. *.localhost resolves to the
# loopback (nss-myhostname, set up by eda_rulebook), where the
# ascender-localhost-80 relay forwards to Traefik.
selfheal_controller_url: http://ascender.localhost

# Ascender objects the self-healing templates are built on (they already
# exist: see README section 1.4).
selfheal_organization: Linux Infrastructure
selfheal_project: Linux Playbooks
selfheal_inventory: Linux Inventory
selfheal_inventory_source: Linux Playbooks - lab
selfheal_machine_credential: Ubuntu VM - svc_ansible (SSH key)
selfheal_team: Linux Team

# Git branch the self-healing templates run from. Empty = the project branch
# (main). Set it on the command line to try a feature branch end to end:
#   -e selfheal_scm_branch=feature/eda-self-healing
selfheal_scm_branch: ""
