---
# Lab: Ubuntu 26.04 VM in VirtualBox on the Windows workstation.
#
# Network path used by Ascender (k3s inside WSL2, mirrored networking):
#   Ascender job pod -> 10.42.0.1:2223 (relay on the WSL host, k3s pod network only)
#                    -> 127.0.0.1:2222 on Windows (VirtualBox NAT port forward "ssh-ascender")
#                    -> VM 10.0.2.15:22
# Inside the VM every connection arrives from the VirtualBox NAT gateway 10.0.2.2,
# which is why cis_mgmt_cidrs (group_vars/all.yml) is 10.0.2.2/32.
all:
  children:
    ubuntu_cis_l1:
      hosts:
        ubuntu-2604-vbox:
          ansible_host: 10.42.0.1
          ansible_port: 2223
    # Hosts that are jump hosts need SSH forwarding (ProxyJump) - see group_vars
    bastions:
      hosts: {}
