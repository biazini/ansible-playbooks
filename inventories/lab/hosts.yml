---
# =============================================================================
# Lab inventory - loaded into Ascender as the source of "Linux Inventory"
# (inventory source "Linux Playbooks - lab"). Variables in group_vars/ next to
# this file are imported together with the hosts.
#
# Add a host: put it under the right group, commit, push, then sync the
# inventory source in Ascender (it also syncs on every job launch).
# Groups:
#   ubuntu_cis_l1  Ubuntu servers that get the CIS Level 1 baseline
#   bastions       jump hosts: same baseline, SSH forwarding kept (group_vars)
#
# Network path used by Ascender (k3s inside WSL2, mirrored networking):
#   Ascender job pod -> 10.42.0.1:2223 (relay on the WSL host, k3s pod network only)
#                    -> 127.0.0.1:2222 on Windows (VirtualBox NAT port forward "ssh-ascender")
#                    -> VM 10.0.2.15:22
# Pods cannot reach the Windows loopback directly, hence the relay
# (systemd unit vbox-ubuntu-ssh-relay in WSL, socat). Inside the VM every
# connection arrives from the VirtualBox NAT gateway 10.0.2.2, which is why
# cis_mgmt_cidrs (group_vars/all.yml) is 10.0.2.2/32.
# =============================================================================
all:
  children:
    ubuntu_cis_l1:
      hosts:
        ubuntu-2604-vbox:            # Ubuntu 26.04 VM in VirtualBox
          ansible_host: 10.42.0.1
          ansible_port: 2223
    bastions:
      hosts: {}
