---
# =============================================================================
# Example inventory for Ubuntu VMs on VMware vSphere (clones of a template with
# guest customisation), managed through the key-only account "ansible".
#
# Copy this folder to inventories/<env>/, replace every <...> value and every
# value marked REPLACE in group_vars/all.yml, then use it with -i:
#   ansible-playbook -i inventories/<env>/hosts.yml playbooks/bootstrap.yml \
#     -l <host> -u <template-admin> -k -K
#   ansible-playbook -i inventories/<env>/hosts.yml playbooks/ping.yml -l <host>
#   ansible-playbook -i inventories/<env>/hosts.yml playbooks/site.yml -l <host> --check --diff
#
# Groups:
#   ubuntu_cis_l1   Ubuntu servers that get the CIS Level 1 baseline
#   bastions        jump hosts: same baseline, SSH forwarding kept (group_vars)
# =============================================================================
all:
  children:
    ubuntu_cis_l1:
      hosts:
        <vm-name>:
          ansible_host: <ip-address>
    bastions:
      hosts: {}
