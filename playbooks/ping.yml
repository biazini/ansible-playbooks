---
# =============================================================================
# Connectivity check
#
# What:  proves that Ascender can reach the host over SSH with the machine
#        credential, that privilege escalation works, and reports OS/kernel.
# When:  after adding a host, after bootstrap, after network or SSH changes.
# Safe:  read-only, runs against every host in the inventory.
# =============================================================================
- name: Connectivity and sudo check
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ping
      ansible.builtin.ping:

    # Facts are gathered with become, so they report root. Ask for the SSH
    # login user without escalation to show which account really connected.
    - name: Remote login user (before privilege escalation)
      ansible.builtin.command: id -un
      become: false
      register: _login_user
      changed_when: false

    - name: Show what we are talking to
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}, kernel {{ ansible_facts['kernel'] }},
          SSH login as {{ _login_user.stdout }}, become -> {{ ansible_facts['user_id'] }}
