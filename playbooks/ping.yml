---
# Connectivity check: SSH login, privilege escalation and basic facts.
- name: Connectivity and sudo check
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ping
      ansible.builtin.ping:

    - name: Show what we are talking to
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}, kernel {{ ansible_facts['kernel'] }},
          logged in as {{ ansible_facts['user_id'] }} (become -> root)
