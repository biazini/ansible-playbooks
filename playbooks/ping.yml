---
# Connectivity check: SSH login, privilege escalation and basic facts.
- name: Connectivity and sudo check
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ping
      ansible.builtin.ping:

    - name: Remote login user (before privilege escalation)
      ansible.builtin.command: id -un
      become: false
      register: _login_user
      changed_when: false

    - name: Show what we are talking to
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}, kernel {{ ansible_facts['kernel'] }},
          SSH login as {{ _login_user.stdout }}, become -> {{ ansible_facts['user_id'] }}
