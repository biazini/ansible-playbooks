---
# Handlers: run once at the end of a block/play when a task reports changed.
# "Reboot if allowed" only reboots when cis_allow_reboot is true; otherwise
# the summary prints a reminder.
- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Update grub
  ansible.builtin.command: update-grub
  changed_when: true

- name: Reload chrony sources
  ansible.builtin.command: chronyc reload sources
  changed_when: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted

- name: Reboot if allowed
  ansible.builtin.reboot:
    reboot_timeout: 900
    msg: "Reboot by Ansible (cis_l1_baseline): /tmp mount options"
  when: cis_allow_reboot | bool
