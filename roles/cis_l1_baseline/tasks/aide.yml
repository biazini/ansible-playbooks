---
- name: AIDE | Packages
  ansible.builtin.apt:
    name: [aide, aide-common]
    state: present

- name: AIDE | Database present
  ansible.builtin.stat:
    path: /var/lib/aide/aide.db
  register: _cis_aide_db

# Building the baseline inside a golden image is pointless: cloud-init changes
# hostname, keys and network on first boot and every clone would start with a
# report full of noise. cis_aide_init is false when cis_template_build is true.
- name: AIDE | Initialise database (runs in background, can take minutes)
  ansible.builtin.command: aideinit --yes --force
  async: 3600
  poll: 0
  when:
    - cis_aide_init | bool
    - not _cis_aide_db.stat.exists
    - not ansible_check_mode   # async is not allowed in check mode
  changed_when: true

- name: AIDE | Daily check timer
  ansible.builtin.systemd_service:
    name: dailyaidecheck.timer
    enabled: true
    state: started
  failed_when: false
