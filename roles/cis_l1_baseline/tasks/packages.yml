---
- name: Packages | Required tooling present
  ansible.builtin.apt:
    name:
      - apparmor
      - apparmor-utils
      - libpam-pwquality
      - chrony
      - acl          # lets Ansible become an unprivileged user without world-readable tmp files
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Packages | open-vm-tools on VMware guests
  ansible.builtin.apt:
    name: open-vm-tools
    state: present
  when: ansible_facts['virtualization_type'] | default('') == 'VMware'

- name: Packages | Legacy / unneeded services absent
  ansible.builtin.apt:
    name: "{{ cis_remove_packages }}"
    state: absent
    purge: true

- name: Packages | Only one firewall front-end (CIS)
  ansible.builtin.apt:
    name: [iptables-persistent, firewalld]
    state: absent
  when: cis_manage_firewall | bool

- name: Packages | Single time daemon - mask systemd-timesyncd if present
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    enabled: false
    masked: true
    state: stopped
  failed_when: false

# CIS "Ensure automatic error reporting is not enabled". Apport also writes
# fs.suid_dumpable=2 every time it starts, overriding the CIS sysctl (0).
- name: Packages | Is apport installed
  ansible.builtin.stat:
    path: /etc/default/apport
  register: _cis_apport

- name: Packages | Automatic error reporting (apport) disabled
  when:
    - cis_disable_apport | bool
    - _cis_apport.stat.exists
  block:
    - name: Packages | Apport off in /etc/default/apport
      ansible.builtin.lineinfile:
        path: /etc/default/apport
        regexp: '^enabled='
        line: enabled=0

    - name: Packages | Apport service stopped and disabled
      ansible.builtin.systemd_service:
        name: apport.service
        enabled: false
        state: stopped
      notify: Apply sysctl
