---
# 26.04 ships chrony with NTS pools in /etc/chrony/sources.d/ubuntu-ntp-pools.sources.
# With internal servers we add our own source file and neutralise the pools
# (the package file is a conffile - we replace its content, we do not delete it).
- name: Time | Internal NTP sources
  ansible.builtin.copy:
    dest: /etc/chrony/sources.d/cis-internal.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (cis_l1_baseline)
      {% for s in cis_ntp_servers %}
      server {{ s }} iburst
      {% endfor %}
  when: cis_ntp_servers | length > 0
  notify: Reload chrony sources

- name: Time | Disable the Ubuntu public pools when internal servers are set
  ansible.builtin.copy:
    dest: /etc/chrony/sources.d/ubuntu-ntp-pools.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (cis_l1_baseline) - internal NTP servers in use
  when: cis_ntp_servers | length > 0
  notify: Reload chrony sources

- name: Time | chrony enabled and running
  ansible.builtin.systemd_service:
    name: chrony.service
    enabled: true
    state: started
