---
# Least-privilege account for ansible-rulebook, and its API token.
# The token is checked first and only replaced when it no longer works (or
# on rotation), so a re-run does not pile up tokens or restart EDA.

- name: Controller | Current token from the ops node
  ansible.builtin.slurp:
    src: "{{ selfheal_eda_env_file }}"
  register: _shc_env_raw
  failed_when: false

- name: Controller | Does the current token still work
  ansible.builtin.uri:
    url: "{{ selfheal_controller_url }}/api/v2/me/"
    headers:
      Authorization: "Bearer {{ _shc_current_token }}"
    status_code: [200, 401, 403]
  vars:
    _shc_current_token: >-
      {{ (_shc_env_raw.content | default('') | b64decode)
         | regex_search('(?m)^EDA_CONTROLLER_TOKEN=(.*)$', '\1') | default([''], true) | first }}
  register: _shc_token_check
  when: _shc_env_raw.content is defined
  no_log: true

- name: Controller | Decide whether to issue a token
  ansible.builtin.set_fact:
    _shc_need_token: >-
      {{ (selfheal_rotate_token | bool)
         or _shc_token_check is skipped
         or _shc_token_check.status != 200
         or (_shc_token_check.json.results | default([{}]) | first).username | default('') != selfheal_eda_username }}

# A fresh random password only when a token must be issued: the password is
# used once, to create the token as the account itself, and never stored.
- name: Controller | One-time password for the account
  ansible.builtin.set_fact:
    _shc_eda_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=40, chars=['ascii_letters', 'digits']) }}"
  when: _shc_need_token | bool
  no_log: true

- name: Controller | Account for Event-Driven Ansible
  awx.awx.user:
    username: "{{ selfheal_eda_username }}"
    first_name: Event-Driven Ansible
    last_name: self-healing
    is_superuser: false
    password: "{{ _shc_eda_password | default(omit) }}"
    update_secrets: "{{ _shc_need_token | bool }}"
  no_log: true

- name: Controller | Account can see the organization (template lookup by name)
  awx.awx.role:
    user: "{{ selfheal_eda_username }}"
    role: member
    organizations: ["{{ selfheal_organization }}"]

- name: Controller | Account can run the remediation template, and nothing else
  awx.awx.role:
    user: "{{ selfheal_eda_username }}"
    role: execute
    job_templates: ["{{ selfheal_jt_remediate }}"]
    lookup_organization: "{{ selfheal_organization }}"

- name: Controller | Issue a new token
  when: _shc_need_token | bool
  block:
    - name: Controller | Account id
      ansible.builtin.set_fact:
        _shc_eda_user: "{{ lookup('awx.awx.controller_api', 'users', query_params={'username': selfheal_eda_username}, expect_one=true) }}"

    - name: Controller | Revoke the account's previous tokens
      awx.awx.token:
        existing_token_id: "{{ item.id }}"
        state: absent
      loop: "{{ query('awx.awx.controller_api', 'users/' ~ _shc_eda_user.id ~ '/tokens', return_all=true) }}"
      loop_control:
        label: "token {{ item.id }}"

    # Created AS the account (its own password), so the token carries only
    # the account's permissions. Scope write = may launch jobs.
    - name: Controller | Token for the account
      awx.awx.token:
        description: ansible-rulebook eda-selfheal ({{ inventory_hostname }})
        scope: write
        controller_username: "{{ selfheal_eda_username }}"
        controller_password: "{{ _shc_eda_password }}"
      register: _shc_token
      no_log: true

    - name: Controller | Token written for the eda-selfheal unit
      ansible.builtin.copy:
        dest: "{{ selfheal_eda_env_file }}"
        content: |
          # Managed by Ansible (role selfheal_controller). Ascender API for
          # ansible-rulebook, account {{ selfheal_eda_username }}. Do not copy.
          EDA_CONTROLLER_URL={{ selfheal_controller_url }}
          EDA_CONTROLLER_TOKEN={{ _shc_token.ansible_facts.controller_token.token }}
          EDA_CONTROLLER_SSL_VERIFY={{ 'yes' if selfheal_controller_url.startswith('https') else 'no' }}
        owner: root
        group: "{{ selfheal_eda_env_group }}"
        mode: "0640"
      no_log: true
      notify: Restart eda-selfheal
