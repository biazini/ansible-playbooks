---
# Automation with limits: a unit that keeps dying is not fixed by restarting
# it again. Past the limit the job fails on purpose with ESCALATE; the alert
# keeps firing and Alertmanager pages on-call (route "on-call").

- name: Breaker | Escalate after too many automatic restarts
  ansible.builtin.fail:
    msg: >-
      ESCALATE - circuit breaker open: {{ _sh_unit }} on {{ inventory_hostname }}
      was restarted {{ _sh_recent | length }} times by automation in the last
      {{ selfheal_breaker_window_minutes }} minutes. Automation stops here and
      on-call is paged. After fixing the cause, launch "Self-Heal - Remediate
      service" with selfheal_reset_breaker=true.
  when: _sh_recent | length >= selfheal_breaker_max | int
