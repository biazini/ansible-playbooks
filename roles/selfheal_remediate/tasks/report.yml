---
# Outage timeline, for the job log and the job statistics (set_stats):
#   down      systemd InactiveEnterTimestamp (host clock)
#   alerted   Alertmanager startsAt of the alert (Prometheus clock)
#   healthy   end of verification (host clock)
# down -> healthy is the real outage the users saw.

- name: Report | Host clock when healthy
  ansible.builtin.command: date +%s
  register: _sh_healthy_at
  changed_when: false

- name: Report | Timeline
  ansible.builtin.set_fact:
    _sh_down: "{{ _sh_down_at.stdout | regex_replace('^@', '') | int }}"
    _sh_healthy: "{{ _sh_healthy_at.stdout | int }}"
    _sh_alerted: >-
      {{ (ansible_eda.event.alert.startsAt | regex_replace('[.][0-9]+', '')
          | to_datetime('%Y-%m-%dT%H:%M:%S%z')).timestamp() | int
         if ansible_eda.event.alert.startsAt is defined else 0 }}

- name: Report | Healed
  ansible.builtin.debug:
    msg:
      - "HEALED - {{ _sh_unit }} on {{ inventory_hostname }} is healthy again."
      - "Outage (down -> healthy): {{ (_sh_healthy | int) - (_sh_down | int) }} s"
      - "Detection (down -> alert fired): {{ _sh_detect }}"
      - "Remediation (alert fired -> healthy): {{ _sh_fix }}"
      - "Automatic restarts in the last {{ selfheal_breaker_window_minutes }} min: {{ (_sh_recent | length) + 1 }}/{{ selfheal_breaker_max }}"
  vars:
    _sh_detect: "{{ ((_sh_alerted | int) - (_sh_down | int)) ~ ' s' if _sh_alerted | int > 0 else 'n/a (manual launch)' }}"
    _sh_fix: "{{ ((_sh_healthy | int) - (_sh_alerted | int)) ~ ' s' if _sh_alerted | int > 0 else 'n/a (manual launch)' }}"

- name: Report | Job statistics
  ansible.builtin.set_stats:
    data:
      selfheal_result: healed
      selfheal_unit: "{{ _sh_unit }}"
      selfheal_outage_seconds: "{{ (_sh_healthy | int) - (_sh_down | int) }}"
      selfheal_restarts_in_window: "{{ (_sh_recent | length) + 1 }}"
